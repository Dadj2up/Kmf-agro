<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KMF – Keur Mame Fallou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--vf:#14532D;--vn:#228B45;--or:#D6AD45;--gc:#F3F5F4;--bl:#FFFFFF;--tx:#1B2A21;--mu:#5C6B63;--ln:#E1E8E3;--rg:#B42318;--rgb:#FBE7E5;--gn:#E4F5EC;--shadow:0 1px 2px rgba(20,83,45,.05),0 8px 24px -12px rgba(20,83,45,.16);--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--gc);color:var(--tx);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
button,input,select{font-family:inherit;font-size:13px}
.hide{display:none!important}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--vf);color:#fff;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.brand .t1{font-family:'Sora',sans-serif;font-weight:800;font-size:14px;line-height:1.15}
.brand .t2{font-size:11px;color:var(--or);font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#D4E6DA;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:#fff;color:var(--vf)}
.nav button.sub{padding:7px 12px 7px 34px;font-size:12.5px;font-weight:500}
.nav .grp{font-size:11px;color:#A9C7B3;text-transform:uppercase;letter-spacing:.6px;padding:14px 12px 4px;font-weight:700}
.me{margin-top:auto;padding:12px;background:rgba(255,255,255,.08);border-radius:12px;font-size:12px}
.me b{display:block;font-size:13px;color:#fff}
.me span{color:#A9C7B3}
.me button{margin-top:8px;background:none;border:1px solid #4E7D5E;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;width:100%}
main{min-width:0}
.top{background:var(--bl);border-bottom:1px solid var(--ln);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top h2{font-family:'Sora',sans-serif;font-size:18px;margin:0;color:var(--vf);flex:1}
.top select{padding:8px 10px;border:1px solid var(--ln);border-radius:9px;background:#fff;color:var(--vf);font-weight:600;max-width:260px}
.burger{display:none;background:none;border:0;font-size:22px;color:var(--vf);cursor:pointer;padding:0 6px}
.wrap{padding:22px 24px 40px;max-width:1180px}
.empty{background:var(--bl);border-radius:var(--r);box-shadow:var(--shadow);padding:28px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--vf);font-family:'Sora',sans-serif;font-size:16px;margin-bottom:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--bl);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;gap:12px;align-items:center}
.ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;background:var(--gn)}
.kpi .lbl{font-size:12px;color:var(--mu);font-weight:600}
.kpi .val{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;color:var(--vf);margin-top:3px}
.ok{color:var(--vn)!important}.ko{color:var(--rg)!important}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--bl);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.panel h3{font-family:'Sora',sans-serif;font-size:14.5px;margin:0 0 14px;color:var(--vf)}
.bars{display:flex;align-items:flex-end;gap:10px;height:180px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mu);text-align:center}
.bar i{display:block;width:100%;background:linear-gradient(var(--vn),var(--vf));border-radius:7px 7px 3px 3px;min-height:2px}
.bar span{margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.sec{background:var(--bl);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border-left:5px solid var(--vn);cursor:pointer}
.sec:hover{transform:translateY(-2px)}
.sec b{font-family:'Sora',sans-serif;color:var(--vf)}
.sec .lbl{font-size:12px;color:var(--mu);margin-top:6px}
.btn{background:var(--vn);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--vf);border:1px solid var(--ln)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mod{background:var(--bl);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-weight:600}
.mod small{display:block;color:var(--mu);font-weight:500;margin-top:4px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;background:var(--bl);padding:16px;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
label{font-size:12px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;gap:5px}
input,select{padding:9px 10px;border:1px solid var(--ln);border-radius:9px;background:#fff;color:var(--tx)}
.err{color:var(--rg);font-size:12px;min-height:16px;grid-column:1/-1}
.tw{overflow-x:auto;background:var(--bl);border-radius:var(--r);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{background:var(--gc);font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--gc);color:var(--vf)}
.tag.r{background:var(--gn);color:var(--vn)}.tag.d{background:var(--rgb);color:var(--rg)}
.totaux{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:14px}
.login{position:fixed;inset:0;background:var(--gc);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.login .box{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:24px;max-width:460px;width:100%}
.login .box img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 8px}
.login h1{font-family:'Sora',sans-serif;font-size:18px;color:var(--vf);text-align:center;margin:0 0 4px}
.login p{color:var(--mu);text-align:center;margin:0 0 14px;font-size:13px}
.acc{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;margin-top:8px;cursor:pointer;background:#fff;text-align:left}
.acc:hover{border-color:var(--vn)}
.acc small{color:var(--mu);display:block}
.setup{display:grid;gap:10px}
.cnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.cnav button{background:#fff;border:1px solid var(--ln);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--vf)}.cnav button.on{background:var(--vf);color:#fff;border-color:var(--vf)}
#cli .top{justify-content:flex-start}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;width:260px;z-index:20;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .burger{display:inline-block}
  .wrap{padding:16px 14px 32px}
  .top{padding:12px 14px;flex-wrap:wrap}
  .top select{max-width:none;width:100%}
}
</style>
</head>

<script>
const KEY="kmf_plateforme_v5";
const SECTEURS=["Élevage","Pisciculture","Agriculture","Poissonnerie","Charcuterie","Alimentation générale","Restauration"];
const ICONS=["🐔","🐟","🌾","🐠","🥩","🛒","🍽️"];
const TYPES=[["Boutique alimentaire","Alimentation générale"],["Poste charcuterie","Charcuterie"],["Poste poissonnerie","Poissonnerie"],["Poulailler","Élevage"],["Pisciculture (bassins)","Pisciculture"],["Champ (agriculture)","Agriculture"],["Restauration","Restauration"]];
const ROLES=["Directeur général","Administrateur","Responsable de secteur","Comptable","Caissier","Magasinier","Employé"];
const PDG="Directeur général";
let DB={sites:[],staff:[],ops:[],products:[],clients:[],orders:[],nextId:1};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.sites)){DB=d;["products","clients","orders"].forEach(k=>{if(!DB[k])DB[k]=[];});}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
const newId=()=>DB.nextId++;
const fmt=n=>new Intl.NumberFormat("fr-FR").format(Math.round(n))+" F";
const siteById=id=>DB.sites.find(s=>s.id===id);
const siteName=id=>id==null?"Siège":((siteById(id)||{}).nom||"—");
let me=null, curSite="all", curSec=-1, curView="dash";
const isPDG=()=>!!me&&me.role===PDG;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function effSite(){return isPDG()?curSite:(me.site==null?"none":String(me.site));}
function opsF(){const e=effSite();return e==="all"?DB.ops:DB.ops.filter(o=>o.site===Number(e));}
function staffF(){const e=effSite();return e==="all"?DB.staff:DB.staff.filter(p=>p.site===Number(e));}
function sitesF(){const e=effSite();return e==="all"?DB.sites:DB.sites.filter(s=>s.id===Number(e));}
function totaux(L){const r=L.filter(o=>o.type==="recette").reduce((a,o)=>a+o.montant,0);const d=L.filter(o=>o.type==="depense").reduce((a,o)=>a+o.montant,0);return{r,d,b:r-d};}

/* ---------- Connexion ---------- */
function renderLogin(){
  const b=document.getElementById("loginBody");
  if(!DB.staff.some(p=>p.role===PDG)){
    b.innerHTML=`<p>Première utilisation : créez le compte du Directeur général (PDG). Il ajoutera ensuite les établissements et le personnel.</p>
      <form class="setup" id="setupF" novalidate>
        <label>Nom complet du PDG<input id="pdgNom" maxlength="60"></label>
        <label>Poste<input id="pdgPoste" value="Directeur général" maxlength="60"></label>
        <button class="btn" type="submit">Créer le compte PDG</button>
        <div class="err" id="pdgErr"></div>
      </form>`;
    document.getElementById("setupF").addEventListener("submit",e=>{
      e.preventDefault();
      const nom=document.getElementById("pdgNom").value.trim();
      if(nom.length<2){document.getElementById("pdgErr").textContent="Indiquez le nom du PDG.";return;}
      const p={id:newId(),nom,poste:document.getElementById("pdgPoste").value.trim()||PDG,role:PDG,site:null};
      DB.staff.push(p);save();login(p);
    });
    return;
  }
  b.innerHTML=`<p>Choisissez votre compte pour continuer.</p>`+
    DB.staff.map(p=>`<button class="acc" onclick="login(${p.id})"><span><b>${esc(p.nom)}</b><small>${esc(p.role)} · ${esc(siteName(p.site))}</small></span><span>→</span></button>`).join("")+`<button class="btn ghost" style="margin-top:12px;width:100%" onclick="renderClientAuth()">Je suis client : espace client →</button>`;
}
function login(p){
  me=typeof p==="number"?DB.staff.find(x=>x.id===p):p;
  if(!me)return;
  curSite=isPDG()?"all":String(me.site);
  document.getElementById("login").classList.add("hide");
  document.getElementById("app").classList.remove("hide");
  cliOff();
  buildChrome();
  show("dash");
}
function logout(){me=null;document.getElementById("app").classList.add("hide");document.getElementById("login").classList.remove("hide");renderLogin();}

/* ---------- Navigation selon le rôle ---------- */
function buildChrome(){
  const nav=document.getElementById("nav");
  let h=`<button data-k="dash" onclick="show('dash')"><span>📊</span>Tableau de bord</button>`;
  if(isPDG()){
    h+=`<button data-k="sites" onclick="show('sites')"><span>🏬</span>Établissements</button>`;
    h+=`<button data-k="sect" onclick="show('sect')"><span>🧭</span>Secteurs</button>`;
    SECTEURS.forEach((s,i)=>{h+=`<button class="sub" data-s="${i}" onclick="openSec(${i})">${ICONS[i]} ${s}</button>`});
    h+=`<div class="grp">Gestion</div><button data-k="staff" onclick="show('staff')"><span>👥</span>Personnel</button>`;
  }
  if(isPDG()||me.site!=null){h+=`<button data-k="cat" onclick="show('cat')"><span>🥫</span>Catalogue</button><button data-k="cmd" onclick="show('cmd')"><span>🧾</span>Commandes</button>`;}
  h+=`<button data-k="fin" onclick="show('fin')"><span>💰</span>Finances</button>`;
  nav.innerHTML=h;
  document.getElementById("me").innerHTML=`<b>${esc(me.nom)}</b><span>${esc(me.role)} · ${esc(siteName(me.site))}</span><button onclick="logout()">Se déconnecter</button>`;
  const sel=document.getElementById("siteSel");
  if(isPDG()){
    sel.classList.remove("hide");
    sel.innerHTML=`<option value="all">Tous les établissements</option>`+DB.sites.map(s=>`<option value="${s.id}">${esc(s.nom)}</option>`).join("");
    sel.value=curSite;
  } else sel.classList.add("hide");
  document.getElementById("stype").innerHTML=TYPES.map(t=>`<option>${esc(t[0])}</option>`).join("");
  document.getElementById("ssite").innerHTML=`<option value="">Siège</option>`+DB.sites.map(s=>`<option value="${s.id}">${esc(s.nom)}</option>`).join("");
  document.getElementById("srole").innerHTML=ROLES.filter(r=>r!==PDG).map(r=>`<option>${r}</option>`).join("");
  document.getElementById("fsite2").innerHTML=DB.sites.map(s=>`<option value="${s.id}">${esc(s.nom)}</option>`).join("");
  document.getElementById("fsiteLbl").classList.toggle("hide",!isPDG());
}
document.getElementById("siteSel").onchange=e=>{curSite=e.target.value;refresh();};

const TITLES={dash:"Tableau de bord",sites:"Établissements",sect:"Secteurs d'activité",sdet:"Secteur",staff:"Personnel",cat:"Catalogue",cmd:"Commandes",fin:"Finances"};
const SECS={dash:"v-dash",sites:"v-sites",sect:"v-sect",sdet:"v-sdet",staff:"v-staff",cat:"v-cat",cmd:"v-cmd",fin:"v-fin"};
const PDG_ONLY=["sites","sect","sdet","staff"];
const R={dash:renderDash,sites:renderSites,sect:renderSect,sdet:()=>renderSecDet(curSec),staff:renderStaff,cat:renderCat,cmd:renderCmd,fin:renderFin};
function show(id){
  if(!isPDG()&&PDG_ONLY.includes(id))id="dash";
  if(!isPDG()&&me.site==null&&(id==="cat"||id==="cmd"))id="dash";
  curView=id;
  Object.entries(SECS).forEach(([k,v])=>document.getElementById(v).classList.toggle("hide",k!==id));
  document.querySelectorAll("#nav button").forEach(b=>{
    b.classList.toggle("on",b.dataset.k===id||(id==="sdet"&&b.dataset.s!==undefined&&Number(b.dataset.s)===curSec));
  });
  document.getElementById("ptitle").textContent=isPDG()?TITLES[id]:(id==="dash"?"Mon établissement":TITLES[id]);
  document.querySelector("aside").classList.remove("open");
  R[id]();
  window.scrollTo(0,0);
}
function refresh(){R[curView]();}

/* ---------- Pages ---------- */
function emptyBox(t1,t2){return `<div class="empty"><b>${t1}</b>${t2}</div>`;}
function renderDash(){
  const el=document.getElementById("v-dash");
  if(!DB.sites.length){
    el.innerHTML=isPDG()?emptyBox("Aucun établissement pour le moment","Commencez par ajouter vos boutiques, postes, poulaillers et champs dans l'onglet Établissements."):emptyBox("Aucun établissement","Le Directeur général n'a pas encore ajouté les établissements.");
    return;
  }
  const L=opsF(), t=totaux(L), S=sitesF();
  if(!S.length){el.innerHTML=emptyBox("Établissement non trouvé","Vérifiez le choix d'établissement.");return;}
  const kp=[["Recettes",fmt(t.r),"💵"],["Dépenses",fmt(t.d),"🧾"],["Résultat",fmt(t.b),"📈",t.b>=0?"ok":"ko"],["Personnel",staffF().length,"👥"]];
  const per=SECTEURS.map(s=>L.filter(o=>o.type==="recette"&&(siteById(o.site)||{}).sec===s).reduce((a,o)=>a+o.montant,0));
  const max=Math.max(1,...per);
  const hasData=L.length>0;
  el.innerHTML=`<div class="kpis">${kp.map(([l,v,ic,c])=>`<div class="kpi"><div class="ico">${ic}</div><div><div class="lbl">${l}</div><div class="val ${c||""}">${v}</div></div></div>`).join("")}</div>
  <div class="grid2"><div class="panel"><h3>Recettes par secteur</h3>${hasData?`<div class="bars">${SECTEURS.map((s,i)=>`<div class="bar"><i style="height:${per[i]/max*100}%"></i><span>${s.split(" ")[0]}</span></div>`).join("")}</div>`:`<p style="color:var(--mu)">Le graphique apparaîtra dès la première opération enregistrée.</p>`}</div>
  <div class="panel"><h3>Établissements</h3>${S.map(s=>`<div class="row"><span>${esc(s.nom)}</span><span class="tag">${DB.staff.filter(p=>p.site===s.id).length} pers.</span></div>`).join("")}</div></div>`;
}
function renderSites(){
  const el=document.getElementById("sitesTw");
  if(!DB.sites.length){el.innerHTML=emptyBox("Aucun établissement","Ajoutez le premier établissement avec le formulaire ci-dessus.");return;}
  el.innerHTML=`<table><thead><tr><th>Établissement</th><th>Type</th><th>Secteur</th><th>Personnel</th><th>Recettes</th><th>Dépenses</th><th>Résultat</th><th></th></tr></thead><tbody>`+
  DB.sites.map(s=>{const t=totaux(DB.ops.filter(o=>o.site===s.id));return `<tr><td><b>${esc(s.nom)}</b></td><td>${esc(s.typeLabel)}</td><td>${esc(s.sec)}</td><td>${DB.staff.filter(p=>p.site===s.id).length}</td><td>${fmt(t.r)}</td><td>${fmt(t.d)}</td><td class="${t.b>=0?"ok":"ko"}"><b>${fmt(t.b)}</b></td><td><button class="btn ghost" onclick="pickSite(${s.id})">Voir</button></td></tr>`}).join("")+`</tbody></table>`;
}
function pickSite(id){curSite=String(id);document.getElementById("siteSel").value=curSite;show("dash");}
document.getElementById("fsite").addEventListener("submit",e=>{
  e.preventDefault();
  const nom=document.getElementById("snomE").value.trim();
  const err=document.getElementById("sieErr");
  if(nom.length<2){err.textContent="Indiquez le nom de l'établissement.";return;}
  const typeLabel=document.getElementById("stype").value;
  const t=TYPES.find(x=>x[0]===typeLabel);
  DB.sites.push({id:newId(),nom,typeLabel,sec:t[1]});save();
  err.textContent="";e.target.reset();
  buildChrome();renderSites();
});
function renderSect(){
  document.getElementById("sectors").innerHTML=SECTEURS.map((s,i)=>{
    const n=DB.sites.filter(x=>x.sec===s).length;
    return `<div class="sec" role="button" tabindex="0" onclick="openSec(${i})" onkeydown="if(event.key==='Enter')openSec(${i})"><b>${ICONS[i]} ${s}</b><div class="lbl">${n} établissement(s) · ouvrir →</div></div>`;
  }).join("");
}
function openSec(i){curSec=i;show("sdet");}
function renderSecDet(i){
  const list=DB.sites.filter(s=>s.sec===SECTEURS[i]);
  document.getElementById("sdet").innerHTML=`<div class="panel"><h3>${ICONS[i]} ${SECTEURS[i]}</h3>`+
    (list.length?list.map(s=>{const t=totaux(DB.ops.filter(o=>o.site===s.id));return `<div class="row"><b>${esc(s.nom)}</b><span>${DB.staff.filter(p=>p.site===s.id).length} pers. · Résultat <b class="${t.b>=0?"ok":"ko"}">${fmt(t.b)}</b></span></div>`}).join(""):`<p style="color:var(--mu)">Aucun établissement dans ce secteur.</p>`)+`</div>`;
}
function renderStaff(){
  const el=document.getElementById("staffTw");
  if(!DB.staff.length){el.innerHTML=emptyBox("Aucun membre du personnel","Ajoutez les employés avec le formulaire ci-dessus.");return;}
  el.innerHTML=`<table><thead><tr><th>Nom</th><th>Poste</th><th>Rôle</th><th>Établissement</th></tr></thead><tbody>`+
  DB.staff.map(p=>`<tr><td><b>${esc(p.nom)}</b></td><td>${esc(p.poste)}</td><td><span class="tag">${esc(p.role)}</span></td><td>${esc(siteName(p.site))}</td></tr>`).join("")+`</tbody></table>`;
}
document.getElementById("fs").addEventListener("submit",e=>{
  e.preventDefault();
  const nom=document.getElementById("snom").value.trim();
  const err=document.getElementById("serr");
  if(nom.length<2){err.textContent="Indiquez le nom de la personne.";return;}
  const sv=document.getElementById("ssite").value;
  const role=document.getElementById("srole").value;
  if(role!=="Administrateur"&&role!=="Comptable"&&sv===""){err.textContent="Choisissez l'établissement de cette personne.";return;}
  DB.staff.push({id:newId(),nom,poste:document.getElementById("sposte").value.trim()||"—",role,site:sv===""?null:Number(sv)});save();
  err.textContent="";e.target.reset();
  renderStaff();
});
function renderFin(){
  const el=document.getElementById("finTw");
  const L=opsF();
  el.innerHTML=L.length?`<table><thead><tr><th>Réf.</th><th>Date</th><th>Type</th><th>Établissement</th><th>Paiement</th><th>Montant</th></tr></thead><tbody>`+
    L.map(o=>`<tr><td>${o.ref}</td><td>${o.date}</td><td><span class="tag ${o.type==="recette"?"r":"d"}">${o.type==="recette"?"Recette":"Dépense"}</span></td><td>${esc(siteName(o.site))}</td><td>${esc(o.pay)}</td><td><b>${fmt(o.montant)}</b></td></tr>`).join("")+`</tbody></table>`:emptyBox("Aucune opération","Les recettes et dépenses enregistrées apparaîtront ici.");
  const t=totaux(L);
  document.getElementById("totaux").innerHTML=`<div class="kpi"><div class="ico">💵</div><div><div class="lbl">Recettes</div><div class="val">${fmt(t.r)}</div></div></div><div class="kpi"><div class="ico">🧾</div><div><div class="lbl">Dépenses</div><div class="val">${fmt(t.d)}</div></div></div><div class="kpi"><div class="ico">📈</div><div><div class="lbl">Résultat net</div><div class="val ${t.b>=0?"ok":"ko"}">${fmt(t.r-t.d)}</div></div></div>`;
}
document.getElementById("f").addEventListener("submit",e=>{
  e.preventDefault();
  const m=Number(document.getElementById("montant").value);
  const err=document.getElementById("err");
  if(!DB.sites.length){err.textContent="Aucun établissement n'existe encore.";return;}
  if(!m||m<=0){err.textContent="Le montant doit être un nombre supérieur à 0.";return;}
  const site=isPDG()?Number(document.getElementById("fsite2").value):me.site;
  if(site==null){err.textContent="Votre compte n'est rattaché à aucun établissement.";return;}
  DB.ops.unshift({id:newId(),ref:"OP-"+String(DB.ops.length+1).padStart(3,"0"),date:new Date().toISOString().slice(0,10),type:document.getElementById("type").value,site,pay:document.getElementById("pay").value,montant:m});
  save();err.textContent="";e.target.reset();
  renderFin();
});

/* ---------- Espace client ---------- */
let cli=null, cliSite=null, cliTab="shop", cliMsg="";
const ST=["Nouvelle","En préparation","Prête","Livrée","Annulée"];
function saveCli(){save();}
function cliOff(){cli=null;cliSite=null;cliTab="shop";document.getElementById("cli").classList.add("hide");}
function renderClientAuth(){
  document.getElementById("app").classList.add("hide");
  document.getElementById("cli").classList.add("hide");
  document.getElementById("login").classList.remove("hide");
  document.getElementById("loginBody").innerHTML=`<p>Espace client : commandez auprès de nos boutiques et postes.</p>`+
    DB.clients.map(c=>`<button class="acc" onclick="cliLogin(${c.id})"><span><b>${esc(c.nom)}</b><small>${esc(c.tel)}</small></span><span>→</span></button>`).join("")+
    `<form class="setup" id="cliF" novalidate style="margin-top:14px"><b style="color:var(--vf)">Créer mon compte client</b>
      <label>Nom complet<input id="cNomC" maxlength="60"></label>
      <label>Téléphone<input id="cTel" maxlength="20" inputmode="tel"></label>
      <button class="btn" type="submit">Continuer</button><div class="err" id="cliErr"></div></form>
     <button class="btn ghost" style="margin-top:12px;width:100%" onclick="renderLogin()">← Espace personnel</button>`;
  document.getElementById("cliF").addEventListener("submit",e=>{
    e.preventDefault();
    const nom=document.getElementById("cNomC").value.trim(), tel=document.getElementById("cTel").value.replace(/\s+/g,"");
    const err=document.getElementById("cliErr");
    if(nom.length<2){err.textContent="Indiquez votre nom.";return;}
    if(tel.length<8){err.textContent="Indiquez un numéro de téléphone valide.";return;}
    let c=DB.clients.find(x=>x.tel===tel);
    if(!c){c={id:newId(),nom,tel,cart:[],cartSite:null};DB.clients.push(c);save();}
    cliLogin(c.id);
  });
}
function cliLogin(id){
  cli=DB.clients.find(c=>c.id===id); if(!cli)return;
  me=null; cliSite=null; cliTab="shop";
  document.getElementById("login").classList.add("hide");
  document.getElementById("app").classList.add("hide");
  renderCli();
}
function cliGo(t){cliTab=t;renderCli();}
function cliQuit(){cliOff();document.getElementById("app").classList.add("hide");document.getElementById("login").classList.remove("hide");renderLogin();}
function cartLines(){return (cli.cart||[]).map(l=>({p:DB.products.find(x=>x.id===l.pid),qty:l.qty})).filter(l=>l.p);}
function renderCli(){
  const el=document.getElementById("cli");
  el.classList.remove("hide");
  const logo=document.querySelector(".brand img").src;
  const n=(cli.cart||[]).reduce((a,l)=>a+l.qty,0);
  const tabs=[["shop","Boutiques"],["cart","Panier ("+n+")"],["orders","Mes commandes"]];
  el.innerHTML=`<div class="top"><img src="${logo}" alt="" style="width:40px;height:40px;object-fit:contain;border-radius:10px;background:#fff;padding:2px"><h2>Espace client KMF</h2><span style="font-size:13px;color:var(--mu)">${esc(cli.nom)}</span><button class="btn ghost" onclick="cliQuit()">Quitter</button></div>
  <div class="wrap">${cliMsg?`<div class="banner">${esc(cliMsg)}</div>`:""}<nav class="cnav">${tabs.map(([k,l])=>`<button class="${cliTab===k?"on":""}" onclick="cliGo('${k}')">${l}</button>`).join("")}</nav><div id="cbody"></div></div>`;
  cliMsg="";
  ({shop:renderShop,cart:renderCart,orders:renderMyOrders})[cliTab]();
}
function renderShop(){
  const b=document.getElementById("cbody");
  if(!DB.sites.length){b.innerHTML=emptyBox("Aucune boutique pour le moment","Les boutiques et postes KMF apparaîtront ici dès qu'ils seront ajoutés.");return;}
  if(cliSite==null){
    b.innerHTML=`<div class="cards">${DB.sites.map(s=>{const n=DB.products.filter(p=>p.siteId===s.id).length;return `<div class="sec" role="button" tabindex="0" onclick="cliPick(${s.id})"><b>${esc(s.nom)}</b><div class="lbl">${esc(s.typeLabel)} · ${n} produit(s) →</div></div>`}).join("")}</div>`;
    return;
  }
  const s=siteById(cliSite);
  const prods=DB.products.filter(p=>p.siteId===cliSite);
  b.innerHTML=`<div style="margin-bottom:14px"><button class="btn ghost" onclick="cliSite=null;renderShop()">← Toutes les boutiques</button></div><div class="panel"><h3>${esc(s?s.nom:"")}</h3>`+
    (prods.length?prods.map(p=>`<div class="row"><span><b>${esc(p.nom)}</b><small style="display:block;color:var(--mu)">${fmt(p.prix)} / ${esc(p.unite||"unité")}</small></span><button class="btn" onclick="cliAdd(${p.id})">+ Ajouter</button></div>`).join(""):`<p style="color:var(--mu)">Aucun produit disponible pour le moment.</p>`)+`</div>`;
}
function cliPick(id){cliSite=id;renderShop();}
function cliAdd(pid){
  const p=DB.products.find(x=>x.id===pid); if(!p)return;
  cli.cart=cli.cart||[];
  if(cli.cart.length&&cli.cartSite!==p.siteId){cliMsg="Votre panier contient des produits d'un autre établissement. Commandez-le ou videz-le d'abord.";renderCli();return;}
  const l=cli.cart.find(x=>x.pid===pid); if(l)l.qty++; else cli.cart.push({pid,qty:1});
  cli.cartSite=p.siteId; saveCli(); cliMsg="Ajouté au panier."; renderCli();
}
function cliQty(pid,d){
  const l=cli.cart.find(x=>x.pid===pid); if(!l)return;
  l.qty+=d; if(l.qty<=0)cli.cart=cli.cart.filter(x=>x.pid!==pid);
  if(!cli.cart.length)cli.cartSite=null;
  saveCli(); renderCli();
}
function renderCart(){
  const b=document.getElementById("cbody");
  const lines=cartLines();
  if(!lines.length){b.innerHTML=emptyBox("Votre panier est vide","Choisissez des produits dans Boutiques.");return;}
  const tot=lines.reduce((a,l)=>a+l.p.prix*l.qty,0);
  const s=siteById(cli.cartSite);
  b.innerHTML=`<div class="panel"><h3>Panier — ${esc(s?s.nom:"")}</h3>`+
    lines.map(l=>`<div class="row"><span><b>${esc(l.p.nom)}</b><small style="display:block;color:var(--mu)">${fmt(l.p.prix)} / ${esc(l.p.unite||"unité")}</small></span><span><button class="btn ghost" onclick="cliQty(${l.p.id},-1)">−</button> <b>${l.qty}</b> <button class="btn ghost" onclick="cliQty(${l.p.id},1)">+</button> <b style="margin-left:8px">${fmt(l.p.prix*l.qty)}</b></span></div>`).join("")+
    `<div class="row"><b>Total</b><b style="font-size:17px;color:var(--vf)">${fmt(tot)}</b></div></div>
    <form class="f" id="ordF" novalidate><label>Réception<select id="omode"><option>Retrait sur place</option><option>Livraison</option></select></label><label>Adresse de livraison<input id="oadr" maxlength="120" placeholder="si livraison"></label><button class="btn" type="submit">Passer la commande</button><div class="err" id="oErr"></div></form>`;
  document.getElementById("ordF").addEventListener("submit",e=>{
    e.preventDefault();
    const mode=document.getElementById("omode").value, adr=document.getElementById("oadr").value.trim();
    if(mode==="Livraison"&&adr.length<5){document.getElementById("oErr").textContent="Indiquez l'adresse de livraison.";return;}
    const items=lines.map(l=>({nom:l.p.nom,prix:l.p.prix,unite:l.p.unite,qty:l.qty}));
    DB.orders.unshift({id:newId(),ref:"CMD-"+String(DB.orders.length+1).padStart(4,"0"),clientId:cli.id,siteId:cli.cartSite,items,total:tot,mode,adresse:mode==="Livraison"?adr:"",date:new Date().toISOString().slice(0,10),statut:"Nouvelle"});
    cli.cart=[]; cli.cartSite=null; saveCli();
    cliMsg="Commande enregistrée. L'établissement va la préparer."; cliTab="orders"; renderCli();
  });
}
function renderMyOrders(){
  const b=document.getElementById("cbody");
  const L=DB.orders.filter(o=>o.clientId===cli.id);
  b.innerHTML=L.length?`<div class="tw"><table><thead><tr><th>Réf.</th><th>Date</th><th>Établissement</th><th>Articles</th><th>Total</th><th>Statut</th></tr></thead><tbody>${L.map(o=>`<tr><td>${o.ref}</td><td>${o.date}</td><td>${esc(siteName(o.siteId))}</td><td>${o.items.map(i=>`${esc(i.nom)} × ${i.qty}`).join("<br>")}</td><td><b>${fmt(o.total)}</b></td><td><span class="tag">${o.statut}</span></td></tr>`).join("")}</tbody></table></div>`:emptyBox("Aucune commande","Vos commandes apparaîtront ici avec leur statut.");
}

/* ---------- Catalogue et commandes (personnel) ---------- */
function renderCat(){
  const sel=document.getElementById("catSite");
  sel.innerHTML=DB.sites.map(s=>`<option value="${s.id}">${esc(s.nom)}</option>`).join("");
  sel.parentElement.classList.toggle("hide",!isPDG());
  const L=DB.products.filter(p=>isPDG()?(effSite()==="all"||p.siteId===Number(effSite())):p.siteId===me.site);
  document.getElementById("catTw").innerHTML=L.length?`<table><thead><tr><th>Produit</th><th>Établissement</th><th>Prix</th><th>Unité</th><th></th></tr></thead><tbody>${L.map(p=>`<tr><td><b>${esc(p.nom)}</b></td><td>${esc(siteName(p.siteId))}</td><td>${fmt(p.prix)}</td><td>${esc(p.unite||"—")}</td><td><button class="btn ghost" onclick="delProd(${p.id})">Retirer</button></td></tr>`).join("")}</tbody></table>`:emptyBox("Aucun produit","Ajoutez les produits que les clients pourront commander.");
}
function delProd(id){DB.products=DB.products.filter(p=>p.id!==id);save();renderCat();}
document.getElementById("fcat").addEventListener("submit",e=>{
  e.preventDefault();
  const err=document.getElementById("cErr");
  const siteId=isPDG()?Number(document.getElementById("catSite").value):me.site;
  const nom=document.getElementById("cNom").value.trim();
  const prix=Number(document.getElementById("cPrix").value);
  if(siteId==null||!siteById(siteId)){err.textContent="Choisissez un établissement.";return;}
  if(nom.length<2){err.textContent="Indiquez le nom du produit.";return;}
  if(!prix||prix<=0){err.textContent="Le prix doit être supérieur à 0.";return;}
  DB.products.push({id:newId(),siteId,nom,prix,unite:document.getElementById("cUnite").value.trim()});
  save();err.textContent="";e.target.reset();renderCat();
});
function renderCmd(){
  const el=document.getElementById("cmdTw");
  const L=DB.orders.filter(o=>isPDG()?(effSite()==="all"||o.siteId===Number(effSite())):o.siteId===me.site);
  if(!L.length){el.innerHTML=emptyBox("Aucune commande","Les commandes des clients apparaîtront ici.");return;}
  el.innerHTML=`<table><thead><tr><th>Réf.</th><th>Date</th><th>Client</th><th>Articles</th><th>Réception</th><th>Total</th><th>Statut</th></tr></thead><tbody>${L.map(o=>{const c=DB.clients.find(x=>x.id===o.clientId)||{nom:"—",tel:""};return `<tr><td>${o.ref}</td><td>${o.date}</td><td>${esc(c.nom)}<small style="display:block;color:var(--mu)">${esc(c.tel)}</small></td><td>${o.items.map(i=>`${esc(i.nom)} × ${i.qty}`).join("<br>")}</td><td>${esc(o.mode)}${o.adresse?`<small style="display:block;color:var(--mu)">${esc(o.adresse)}</small>`:""}</td><td><b>${fmt(o.total)}</b></td><td><select onchange="setStatut(${o.id},this.value)">${ST.map(x=>`<option ${x===o.statut?"selected":""}>${x}</option>`).join("")}</select></td></tr>`}).join("")}</tbody></table>`;
}
function setStatut(id,v){const o=DB.orders.find(x=>x.id===id);if(o){o.statut=v;save();}}

load();
renderLogin();
</script>
</body>
</html>
